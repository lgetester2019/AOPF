<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление статьями</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Quill.js редактор - современный и удобный -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <!-- Datepicker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .editor-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            border: none;
        }
        
        .card-header h2 {
            margin: 0;
            font-size: 1.8rem;
        }
        
        .card-body {
            padding: 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        
        /* Стили для Quill редактора */
        #editor-container {
            height: 400px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
        }
        
        .ql-toolbar {
            border: 2px solid #e0e0e0 !important;
            border-radius: 10px 10px 0 0;
            background: #f8f9fa;
        }
        
        .btn-save {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        
        .btn-preview {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            margin-right: 10px;
        }
        
        .date-picker {
            background: white;
        }
        
        .meta-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .slug-preview {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-card">
            <div class="card-header">
                <h2>📝 Создание новой статьи</h2>
                <p class="mb-0 mt-2 opacity-75">Заполните все поля для публикации статьи</p>
            </div>
            
            <div class="card-body">
                <form id="articleForm">
                    <!-- Заголовок статьи -->
                    <div class="mb-4">
                        <label class="form-label">Заголовок статьи</label>
                        <input type="text" class="form-control" id="title" placeholder="Введите заголовок" required>
                    </div>
                    
                    <!-- Мета информация -->
                    <div class="meta-info">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Дата публикации</label>
                                <input type="text" class="form-control date-picker" id="publishDate" placeholder="Выберите дату">
                                <small class="text-muted">Оставьте пустым для текущей даты</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Категория</label>
                                <select class="form-select" id="category">
                                    <option value="news">Новости</option>
                                    <option value="articles">Статьи</option>
                                    <option value="events">События</option>
                                    <option value="announcements">Объявления</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-md-12">
                                <label class="form-label">URL статьи (slug)</label>
                                <input type="text" class="form-control" id="slug" placeholder="kak-pravilno-vybrat-oborudovanie">
                                <div class="slug-preview" id="slugPreview"></div>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label class="form-label">Автор</label>
                                <input type="text" class="form-control" id="author" value="Администратор">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Краткое описание (meta description)</label>
                                <input type="text" class="form-control" id="metaDesc" placeholder="Краткое описание для поисковиков">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Текст статьи с редактором -->
                    <div class="mb-4">
                        <label class="form-label">Содержание статьи</label>
                        <!-- Скрытое поле для хранения HTML -->
                        <input type="hidden" id="content" name="content">
                        <!-- Редактор -->
                        <div id="editor-container"></div>
                    </div>
                    
                    <!-- Изображение -->
                    <div class="mb-4">
                        <label class="form-label">URL изображения (опционально)</label>
                        <input type="url" class="form-control" id="imageUrl" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <!-- Кнопки -->
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <button type="button" class="btn-preview" id="previewBtn">👁️ Предпросмотр</button>
                            <button type="button" class="btn btn-secondary" id="clearBtn">Очистить</button>
                        </div>
                        <button type="submit" class="btn-save">💾 Опубликовать статью</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно предпросмотра -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Предпросмотр статьи</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="previewContent">
                    <!-- Здесь будет превью -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        // Инициализация редактора Quill
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image'],
                    ['clean']
                ]
            },
            placeholder: 'Напишите содержание статьи здесь...'
        });
        
        // Инициализация datepicker
        flatpickr("#publishDate", {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            defaultDate: new Date(),
            locale: "ru"
        });
        
        // Автоматическое создание slug из заголовка
        document.getElementById('title').addEventListener('input', function(e) {
            const title = e.target.value;
            const slug = title
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/--+/g, '-')
                .trim();
            
            document.getElementById('slug').value = slug;
            document.getElementById('slugPreview').textContent = 'URL: /articles/' + slug;
        });
        
        // Обработка отправки формы
        document.getElementById('articleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Получаем HTML из редактора
            const contentHTML = quill.root.innerHTML;
            document.getElementById('content').value = contentHTML;
            
            // Формируем данные для отправки
            const formData = {
                title: document.getElementById('title').value,
                content: contentHTML,
                publish_date: document.getElementById('publishDate').value || new Date().toISOString().slice(0, 19).replace('T', ' '),
                category: document.getElementById('category').value,
                slug: document.getElementById('slug').value,
                author: document.getElementById('author').value,
                meta_description: document.getElementById('metaDesc').value,
                image_url: document.getElementById('imageUrl').value,
                status: 'published'
            };
            
            // Валидация
            if (!formData.title || !formData.content) {
                alert('Пожалуйста, заполните заголовок и содержание статьи');
                return;
            }
            
            try {
                // Здесь нужно отправить данные в ваш бэкенд
                console.log('Отправка данных:', formData);
                
                // Пример отправки через axios
                // const response = await axios.post('/api/articles', formData);
                
                alert('Статья успешно сохранена!');
                
                // Очистка формы (опционально)
                // quill.setText('');
                // document.getElementById('articleForm').reset();
                
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при сохранении статьи');
            }
        });
        
        // Предпросмотр
        document.getElementById('previewBtn').addEventListener('click', function() {
            const title = document.getElementById('title').value || 'Без заголовка';
            const content = quill.root.innerHTML || '<p>Нет содержимого</p>';
            
            const previewHTML = `
                <div class="article-preview">
                    <h1 class="mb-4">${title}</h1>
                    <div class="meta text-muted mb-4">
                        <span>📅 ${document.getElementById('publishDate').value || new Date().toLocaleString()}</span>
                        <span class="ms-3">👤 ${document.getElementById('author').value}</span>
                        <span class="ms-3">🏷️ ${document.getElementById('category').options[document.getElementById('category').selectedIndex].text}</span>
                    </div>
                    ${document.getElementById('imageUrl').value ? 
                        `<img src="${document.getElementById('imageUrl').value}" class="img-fluid mb-4" style="max-height: 400px;">` : ''}
                    <div class="content">
                        ${content}
                    </div>
                </div>
            `;
            
            document.getElementById('previewContent').innerHTML = previewHTML;
            
            var previewModal = new bootstrap.Modal(document.getElementById('previewModal'));
            previewModal.show();
        });
        
        // Очистка формы
        document.getElementById('clearBtn').addEventListener('click', function() {
            if(confirm('Очистить все поля?')) {
                quill.setText('');
                document.getElementById('articleForm').reset();
                flatpickr("#publishDate").setDate(new Date());
            }
        });
        
        // Загрузка существующей статьи (если передан ID)
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        
        if(articleId) {
            // Загрузить данные статьи
            console.log('Загрузка статьи с ID:', articleId);
            // Здесь нужно сделать запрос к API для загрузки данных
        }
    </script>
</body>
</html>
